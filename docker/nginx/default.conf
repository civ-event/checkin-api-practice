# Nginx 站点配置：把 HTTP 请求转给 PHP-FPM
server {
    listen 80;                 # 监听容器内 80 端口
    server_name _;             # 匹配任意 Host
    root /var/www/html/public; # 文档根指向 public（只暴露入口）
    index index.php;           # 默认首页脚本

    location / {
        # 静态文件直接返回；否则回退到 index.php（前端控制器）
        try_files $uri /index.php$is_args$args;
    }
    # /front.php/check-in/status 里，脚本名是 /front.php，后面的 /check-in/status 放进 PATH_INFO。
    # 不写这段的话，try_files 会把整段交给 index.php，短路由对不上。index.php 和 front.php 是同一套 SlimApp。
    location ~ ^/front\.php(/|$) {
        include fastcgi_params;
        fastcgi_split_path_info ^(/front\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME $document_root/front.php;
        fastcgi_param SCRIPT_NAME /front.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_pass app:9000;
    }

    location ~ \.php$ { # 所有 .php 请求交给 FPM
        include fastcgi_params; # FastCGI 标准参数
        # 告诉 PHP 真正要执行的脚本绝对路径
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass app:9000; # app 服务的 PHP-FPM 监听 9000
    }

    location ~ /\. { # 禁止访问 .env / .git 等隐藏路径
        deny all;
    }
}
