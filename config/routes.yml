# 这些 path 是去掉入口脚本名之后的 PATH_INFO。
# 浏览器或 curl 要写 /front.php/memcached，路由里只写 /memcached。直接写 /front.php 会对不上，变成 404。

# 内核探活，正文是纯文本 slimapp ok
slim_health:
  path: /
  defaults:
    _controller: SlimHealthController::healthAction

# 确认 services.yml 里的 Memcached 客户端可用
slim_memcached:
  path: /memcached
  defaults:
    _controller: SlimHealthController::memcachedAction

# 抢一把探测锁再释放，正文是 lock ok
slim_lock:
  path: /lock
  defaults:
    _controller: SlimHealthController::lockAction

# SELECT 1，确认 Doctrine 连上 MySQL
slim_db:
  path: /db
  defaults:
    _controller: SlimHealthController::dbAction

# 确认数组返回值会被 JsonResultHandler 编成 JSON
slim_json:
  path: /json
  defaults:
    _controller: SlimHealthController::jsonAction

# 月度签到状态。需要 join 签发的 activity-user-token
slim_checkin_status:
  path: /check-in/status
  defaults:
    _controller: SlimCheckInController::statusAction

# 打卡并发奖。今天已签过再签下一档会扣补签次数，次数用完是 MAKEUP_LIMIT_EXCEEDED。
slim_checkin_clock_in:
  path: /check-in/clock-in
  methods: [POST]
  defaults:
    _controller: SlimCheckInController::clockInAction

# 月度累充状态。成功时由 JsonResultHandler 原样输出 JSON。
slim_recharge_status:
  path: /recharge/status
  methods: [GET]
  defaults:
    _controller: SlimRechargeController::statusAction

# 按 mock_payments 重算当月金额。请求里的 amount 不累加。
slim_recharge_record:
  path: /recharge/record
  methods: [POST]
  defaults:
    _controller: SlimRechargeController::recordAction

# 按档位领奖
slim_recharge_claim:
  path: /recharge/claim
  methods: [POST]
  defaults:
    _controller: SlimRechargeController::claimAction

# 假账号的角色列表
slim_auth_roles:
  path: /auth/roles
  methods: [POST]
  defaults:
    _controller: SlimAuthController::rolesAction

# 登录。JWT 里的 role_id 是角色表主键，响应字段是 activityUserToken
slim_auth_login:
  path: /auth/login
  methods: [POST]
  defaults:
    _controller: SlimAuthController::loginAction

# 下面这些是前端现在用的完整路径，Nginx 回退到 index.php 后按原路径匹配。
# 控制器和上面的短路径是同一批。/front.php 后面只接短路径，例如 /front.php/check-in/status。

slim_auth_roles_legacy:
  path: /api-front/auth/roles
  methods: [POST]
  defaults:
    _controller: SlimAuthController::rolesAction

slim_auth_login_legacy:
  path: /api-front/auth/login
  methods: [POST]
  defaults:
    _controller: SlimAuthController::loginAction

slim_checkin_status_legacy:
  path: /api-front/activity/check-in/status
  methods: [GET]
  defaults:
    _controller: SlimCheckInController::statusAction

slim_checkin_clock_in_legacy:
  path: /api-front/activity/check-in/clock-in
  methods: [POST]
  defaults:
    _controller: SlimCheckInController::clockInAction

slim_recharge_status_legacy:
  path: /api-front/activity/recharge/status
  methods: [GET]
  defaults:
    _controller: SlimRechargeController::statusAction

slim_recharge_record_legacy:
  path: /api-front/activity/recharge/record
  methods: [POST]
  defaults:
    _controller: SlimRechargeController::recordAction

slim_recharge_claim_legacy:
  path: /api-front/activity/recharge/claim
  methods: [POST]
  defaults:
    _controller: SlimRechargeController::claimAction

# 与前端路径一致。控制器和上面的旧地址是同一批。

slim_auth_roles_client:
  path: /api-auth/activity/get-user-role-list
  methods: [POST]
  defaults:
    _controller: SlimAuthController::rolesAction

slim_auth_join_client:
  path: /api-auth/activity/join
  methods: [POST]
  defaults:
    _controller: SlimAuthController::loginAction

slim_checkin_status_client:
  path: /api-front/activity/monthly-check-in/status
  methods: [GET]
  defaults:
    _controller: SlimCheckInController::statusAction

slim_checkin_clock_in_client:
  path: /api-front/activity/monthly-check-in/clock-in
  methods: [POST]
  defaults:
    _controller: SlimCheckInController::clockInAction

slim_recharge_status_client:
  path: /api-front/activity/monthly-cumulative-recharge/status
  methods: [GET]
  defaults:
    _controller: SlimRechargeController::statusAction

slim_recharge_claim_client:
  path: /api-front/activity/monthly-cumulative-recharge/claim
  methods: [POST]
  defaults:
    _controller: SlimRechargeController::claimAction
