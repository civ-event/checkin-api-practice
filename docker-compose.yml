# Docker Compose：本地一键起 nginx + php-app + mysql + memcached
services:
  nginx: # 反向代理，对外提供 HTTP
    image: nginx:1.27-alpine # 轻量 Nginx 镜像
    ports:
      - "${HTTP_PORT:-8080}:80" # 宿主机端口 → 容器 80（默认 8080）
    volumes:
      - ./:/var/www/html:ro # 项目只读挂到站点根
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro # 自定义站点配置
    depends_on:
      - app # 等 PHP-FPM 服务起来
    networks:
      - checkin # 加入项目网络

  app: # PHP-FPM 应用容器
    build:
      context: . # 以项目根为构建上下文
      dockerfile: docker/php/Dockerfile # PHP 镜像定义
    volumes:
      - ./:/var/www/html # 代码可写挂载（改代码即时生效）
    env_file:
      - .env # 注入环境变量（勿把真实密钥提交 git）
    depends_on:
      mysql:
        condition: service_healthy # 等 MySQL 健康检查通过
      memcached:
        condition: service_started # Memcached 启动即可
    networks:
      - checkin

  mysql: # MySQL 8.4
    image: mysql:8.4
    ports:
      - "${MYSQL_PORT:-3306}:3306" # 宿主机可直连调试
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-checkin} # 自动建库名
      MYSQL_USER: ${MYSQL_USER:-checkin} # 业务用户
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-checkin} # 业务密码
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root} # root 密码
    command:
      - --character-set-server=utf8mb4 # 默认字符集
      - --collation-server=utf8mb4_unicode_ci # 默认排序规则
    volumes:
      - mysql_data:/var/lib/mysql # 数据持久化到命名卷
    healthcheck:
      test: [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD:-root}",
        ] # 探活
      interval: 5s # 每 5 秒一次
      timeout: 5s
      retries: 20 # 最多重试 20 次
    networks:
      - checkin

  memcached: # Memcached（锁；只在内存，不挂数据卷）
    image: memcached:1.6-alpine
    ports:
      - "${MEMCACHED_PORT:-11211}:11211"
    networks:
      - checkin

volumes: # 命名卷定义
  mysql_data: # MySQL 数据

networks:
  checkin:
    driver: bridge # 默认桥接网络，容器互相用服务名访问
